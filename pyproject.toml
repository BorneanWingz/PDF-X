[project]
name = "pdf-toolbox"
version = "0.1.4"
description = "Portable offline PDF converter and OCR toolbox for internal team use"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "pypdfium2>=4.30.0",
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.4",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
    "Pillow>=10.4.0",
    "reportlab>=4.2.5",
    "rapidocr-onnxruntime>=1.4.4",
    "tkinterdnd2>=0.4.2",
]

[project.optional-dependencies]
agpl = ["pdf2docx>=0.5.13"]
dev = ["pytest>=8.3.0", "pyinstaller>=6.22.0"]

[project.scripts]
pdftoolbox = "pdftoolbox.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
